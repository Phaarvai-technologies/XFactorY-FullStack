<title>X!Y — Why own it when you can make it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545;
    --blue-deep:#14498C;
    --blue-bright:#2F6FED;
    --blue-pale:#EAF1FB;
    --blueprint-line:#C7D9F0;
    --blueprint-line-strong:#9FBBE0;
    --white:#FFFFFF;
    --ink-soft:#4A5C74;
    --amber:#9A6A00;
    --amber-bg:#FDF3E1;
    --card-bg:#F3F8FF;
    --card-border:#C5DDF5;
    --max:1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--white);
    color:var(--navy);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',system-ui,sans-serif;
    color:var(--navy);
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--blue-bright);outline-offset:3px;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;}

  /* ---------- blueprint texture ---------- */
  .blueprint-bg{
    background-image:
      linear-gradient(var(--blueprint-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--blueprint-line) 1px, transparent 1px);
    background-size:40px 40px;
    background-color:var(--blue-pale);
  }

  /* ---------- header ---------- */
  header{
    border-bottom:1px solid var(--blueprint-line);
    background:var(--white);
    position:sticky;top:0;z-index:50;
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    height:72px;
  }
  .logo{
    font-family:'Space Grotesk';font-weight:700;font-size:22px;
    display:flex;align-items:center;gap:8px;
  }
  .logo svg.factory-mark{width:30px;height:26px;flex:none;color:var(--blue-bright);}
  nav.primary-links{display:flex;gap:32px;font-size:14.5px;font-weight:500;color:var(--ink-soft);}
  nav.primary-links a:hover{color:var(--blue-bright);}
  .header-actions{display:flex;gap:12px;align-items:center;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;font-size:14.5px;font-weight:600;
    border:1.5px solid transparent;cursor:pointer;
    font-family:'Inter';transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-primary{background:var(--blue-deep);color:var(--white);}
  .btn-primary:hover{background:var(--navy);}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--navy);}
  .btn-ghost:hover{border-color:var(--blue-bright);color:var(--blue-bright);}
  .btn-text{background:transparent;color:var(--blue-deep);padding:11px 4px;}
  .btn-text:hover{color:var(--blue-bright);}

  /* ---------- pilot notice ---------- */
  .pilot-strip{
    background:var(--amber-bg);border-bottom:1px solid #F0DDAF;
    color:var(--amber);font-size:13.5px;font-weight:500;
  }
  .pilot-strip .wrap{display:flex;align-items:center;gap:10px;padding-top:9px;padding-bottom:9px;}
  .pilot-dot{width:7px;height:7px;background:var(--amber);flex:none;}
