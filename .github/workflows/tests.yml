# Runs the backend and frontend test suites on GitHub's machines on every push and pull request.
# The backend tests use a throwaway PostgreSQL + PostGIS database that exists only during the run:
# no secrets are needed and production (Supabase, Clerk) is never touched.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: xy
          POSTGRES_PASSWORD: xy
          POSTGRES_DB: xy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xy -d xy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only values: a database created for this run, dummy Clerk settings (the tests sign their own tokens).
      DATABASE_URL: postgresql+asyncpg://xy:xy@localhost:5432/xy_test
      E2E_DATABASE_URL: postgresql+asyncpg://xy:xy@localhost:5432/xy_test
      CLERK_ISSUER: https://test.clerk.accounts.dev
      CLERK_JWKS_URL: https://test.clerk.accounts.dev/.well-known/jwks.json
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create the schema and apply all migrations
        run: python -m app.migrate
      - name: Run the tests
        run: python -m pytest -q

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run the tests
        run: npx vitest run
